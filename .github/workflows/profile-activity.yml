name: Update profile activity

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/profile-activity.yml
  pull_request:
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/profile-activity.yml

permissions:
  contents: read

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test activity generation
        run: python -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Generate activity from GitHub GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py --username krishna0605
      - name: Save successful refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributions.svg
          if git diff --cached --quiet; then
            echo "Activity is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile activity"
          git push origin HEAD:main
