<text x="0" y="164" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="18" font-style="italic" fill="var(--ink)">Understanding connected code.</text>
<text x="0" y="190" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="18" font-style="italic" fill="var(--ink)">Validating software. Engineering</text>
