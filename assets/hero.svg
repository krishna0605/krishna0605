<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d">
<title id="t">Krishna Kapoor</title>
<desc id="d">Krishna Kapoor, software engineering, cybersecurity and DevSecOps. A code change travels from commit through CI and a gateway into a Python service and a Java service, which share a validation assumption, and on to production.</desc>
<style>svg{--paper:#ffffff;--ink:#14181d;--dim:#6a737f;--rule:#dde1e7;--rule-soft:#eef0f3;--line:#9aa4b0;--node:#ffffff;--grid:#eef1f5;--accent:#1a7f37;--warn:#9a6700}@media(prefers-color-scheme:dark){svg{--paper:#0d1117;--ink:#e9edf2;--dim:#8b95a2;--rule:#2a313a;--rule-soft:#20262e;--line:#56636f;--node:#151b23;--grid:#171e26;--accent:#3fb950;--warn:#d29922}}.dot{animation:trav 5.4s linear infinite}@keyframes trav{0%{transform:translate(420px,62px);opacity:0}7%{opacity:1}24%{transform:translate(527px,62px)}46%{transform:translate(634px,110px)}68%{transform:translate(741px,166px)}92%{transform:translate(838px,110px);opacity:1}100%{transform:translate(838px,110px);opacity:0}}.ring{animation:ring 3.2s ease-out infinite}@keyframes ring{0%{r:5;opacity:.85}70%{r:17;opacity:0}100%{r:17;opacity:0}}.core{animation:core 3.2s ease-in-out infinite}@keyframes core{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
