<text x="0" y="26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" letter-spacing="3.4" font-weight="600" fill="var(--accent)">AHMEDABAD, INDIA</text>
<text x="0" y="86" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-size="47" letter-spacing="-1.1" fill="var(--ink)">Krishna Kapoor</text>
